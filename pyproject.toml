[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# The import name stays `capstack`; the distribution name cannot, because
# `capstack` on the package index belongs to an unrelated library. The console
# script below is aliased so that the distribution name resolves too.
name = "capstack-lbo"
version = "0.1.0"
description = "A leveraged buyout engine: sources and uses, a debt waterfall with cash sweep, covenant tests, and returns attribution."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniyal" }]
keywords = ["lbo", "leveraged-buyout", "private-equity", "finance", "debt-schedule", "irr"]
# `Typing :: Typed` is a promise to type checkers that py.typed keeps. Nothing
# connects the two but tests/test_metadata.py.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.8", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/DaniyalMlk/capstack"
Repository = "https://github.com/DaniyalMlk/capstack"
Issues = "https://github.com/DaniyalMlk/capstack/issues"

[project.scripts]
capstack = "capstack.cli:main"
# So that `uvx capstack-lbo` resolves: a distribution whose only entry point is
# named something else leaves the obvious invocation failing.
capstack-lbo = "capstack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
capstack = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
warn_unreachable = true
disallow_any_explicit = false

# The same rule set the sibling projects run, so that a habit learnt in one of
# them is the habit this one wants too. The three RUF00x exclusions are the
# unicode look-alike checks: the prose here uses en dashes and typographic
# quotes on purpose.
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "N", "C4", "PIE"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# A test's name is its documentation and wrapping one costs more than it buys.
"tests/*" = ["E501"]
